<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Dashboard</title>
<style>
  :root{
    --bg:#0b1020; --card:#141b33; --line:#232d52;
    --text:#e8ecf8; --muted:#8b95b8; --accent:#4f7cff; --ok:#2fbf71;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif;}
  body{background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px;}
  .wrap{max-width:560px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:24px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px;}
  label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px;}
  input, textarea{
    width:100%; background:#0e1530; border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:12px; font-size:15px;
  }
  textarea{min-height:80px; resize:vertical;}
  input:focus, textarea:focus{outline:none; border-color:var(--accent);}
  button{
    width:100%; margin-top:20px; background:var(--accent); color:#fff; border:none;
    border-radius:10px; padding:14px; font-size:16px; font-weight:600; cursor:pointer;
  }
  button:disabled{opacity:.5;}
  .msg{margin-top:14px; font-size:14px; text-align:center; display:none;}
  .msg.ok{color:var(--ok); display:block;}
  .msg.err{color:#ff6b6b; display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Business Profile</h1>
  <div class="sub">Fill this once. Your AI assistant will answer customers using this info.</div>

  <div class="card">
    <label>Business name</label>
    <input id="name" placeholder="e.g. Shafi Bakery">

    <label>Description (what do you do?)</label>
    <textarea id="description" placeholder="e.g. Family bakery in Dehiwala since 1998. Fresh bread, cakes, short eats."></textarea>

    <label>Services / products</label>
    <textarea id="services" placeholder="e.g. Bread, birthday cakes, catering for events"></textarea>

    <label>Prices</label>
    <textarea id="prices" placeholder="e.g. Bread Rs.150, 1kg cake Rs.3500, delivery Rs.300"></textarea>

    <label>Opening hours</label>
    <input id="opening_hours" placeholder="e.g. Mon-Sat 8am-8pm, Sunday closed">

    <button id="saveBtn">Save profile</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://tsyiwisklhdgijsoibxj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_s5PoS2a2H70WtLhriKDWMw_IiczfAUL";

  const $ = id => document.getElementById(id);

  $("saveBtn").onclick = async () => {
    const body = {
      name: $("name").value.trim(),
      description: $("description").value.trim(),
      services: $("services").value.trim(),
      prices: $("prices").value.trim(),
      opening_hours: $("opening_hours").value.trim()
    };

    if(!body.name){
      show("Please type the business name.", false);
      return;
    }

    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "Saving\u2026";

    try{
      const res = await fetch(SUPABASE_URL + "/rest/v1/businesses", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(body)
      });

      if(res.ok){
        show("\u2705 Saved! Check your Supabase table.", true);
      }else{
        const t = await res.text();
        show("Could not save: " + t, false);
      }
    }catch(e){
      show("Network problem: " + e.message, false);
    }

    $("saveBtn").disabled = false;
    $("saveBtn").textContent = "Save profile";
  };

  function show(text, ok){
    const m = $("msg");
    m.textContent = text;
    m.className = "msg " + (ok ? "ok" : "err");
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with us</title>
<style>
  :root{
    --bg:#0b1020; --card:#141b33; --line:#232d52;
    --text:#e8ecf8; --muted:#8b95b8; --accent:#4f7cff;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif;}
  body{background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column;}
  header{padding:16px; border-bottom:1px solid var(--line); text-align:center;}
  header h1{font-size:17px;}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  #chat{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;}
  .bubble{max-width:82%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.45; white-space:pre-wrap;}
  .ai{background:var(--card); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px;}
  .me{background:var(--accent); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
  .typing{color:var(--muted); font-size:13px; align-self:flex-start; padding:4px 14px; display:none;}
  footer{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px;}
  input{
    flex:1; background:#0e1530; border:1px solid var(--line); border-radius:22px;
    color:var(--text); padding:12px 16px; font-size:15px;
  }
  input:focus{outline:none; border-color:var(--accent);}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:22px;
    padding:0 20px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled{opacity:.5;}
</style>
</head>
<body>
<header>
  <h1 id="bizName">Chat with us</h1>
  <div class="sub">Ask anything — services, prices, opening hours</div>
</header>

<div id="chat">
  <div class="bubble ai">Hello! 👋 How can I help you today?</div>
</div>
<div class="typing" id="typing">typing…</div>

<footer>
  <input id="msg" placeholder="Type your question…" autocomplete="off">
  <button id="send">Send</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("msg");
  const sendBtn = document.getElementById("send");
  const typing = document.getElementById("typing");

  // conversation history we send to the kitchen each time
  let history = [];

  function addBubble(text, who){
    const b = document.createElement("div");
    b.className = "bubble " + who;
    b.textContent = text;
    chat.appendChild(b);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send(){
    const text = input.value.trim();
    if(!text) return;

    input.value = "";
    addBubble(text, "me");
    history.push({ role: "user", content: text });

    sendBtn.disabled = true;
    typing.style.display = "block";

    try{
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();

      addBubble(data.answer, "ai");
      history.push({ role: "assistant", content: data.answer });
    }catch(e){
      addBubble("Sorry, connection problem. Please try again.", "ai");
    }

    typing.style.display = "none";
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.onclick = send;
  input.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
</script>
</body>
</html>
